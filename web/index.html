<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Open Field</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #f2f7ff;
    --dim: rgba(242, 247, 255, 0.62);
    --panel: rgba(10, 16, 28, 0.42);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1220;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  .panel {
    position: absolute;
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
  }

  #stats { top: 16px; left: 16px; min-width: 168px; }
  #stats .row { display: flex; justify-content: space-between; gap: 18px; }
  #stats .k { color: var(--dim); }
  #stats .v { font-variant-numeric: tabular-nums; }

  #score { top: 16px; right: 16px; text-align: right; }
  #score .n { font-size: 26px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #score .l { color: var(--dim); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; }

  #help { bottom: 16px; left: 16px; }
  #help kbd {
    display: inline-block; min-width: 20px; text-align: center;
    padding: 1px 6px; margin: 0 1px;
    border-radius: 5px; border: 1px solid rgba(255,255,255,0.20);
    background: rgba(255,255,255,0.08);
    font: inherit; font-size: 11px;
  }
  #help .line { color: var(--dim); }
  #help .line b { color: var(--ink); font-weight: 500; }

  #toast {
    position: absolute; left: 50%; top: 22%; transform: translate(-50%, -6px);
    font-size: 15px; font-weight: 550; letter-spacing: 0.01em;
    opacity: 0; transition: opacity .25s ease, transform .25s ease;
    text-shadow: 0 2px 14px rgba(0,0,0,.55);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(ellipse at 50% 42%, #1b2c4e 0%, #090e1a 72%);
    transition: opacity .6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.02em; }
  #loader .sub { color: var(--dim); font-size: 12.5px; min-height: 1.2em; }
  #bar { width: 240px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: #ffd23f; transition: width .3s ease; }

  #startHint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
    transition: opacity .4s ease;
  }
  #startHint .big { font-size: 15px; font-weight: 550; }
  #startHint .small { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #startHint.hidden { opacity: 0; }
</style>
</head>
<body>

<div id="hud">
  <div class="panel" id="stats">
    <div class="row"><span class="k">fps</span><span class="v" id="s-fps">–</span></div>
    <div class="row"><span class="k">time</span><span class="v" id="s-time">–</span></div>
    <div class="row"><span class="k">altitude</span><span class="v" id="s-alt">–</span></div>
    <div class="row"><span class="k">tris</span><span class="v" id="s-tris">–</span></div>
  </div>

  <div class="panel" id="score">
    <div class="n"><span id="s-berries">0</span> <span style="opacity:.45">/ <span id="s-total">0</span></span></div>
    <div class="l">berries</div>
  </div>

  <div class="panel" id="help">
    <div class="line"><b><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></b> move &nbsp; <b><kbd>shift</kbd></b> sprint &nbsp; <b><kbd>space</kbd></b> jump</div>
    <div class="line"><b>mouse</b> look &nbsp; <b>wheel</b> zoom &nbsp; <b><kbd>F</kbd></b> free-cam &nbsp; <b><kbd>T</kbd></b> time &nbsp; <b><kbd>esc</kbd></b> release</div>
  </div>

  <div id="toast"></div>
  <div id="startHint"><div class="big">click to look around</div><div class="small">WASD to move</div></div>
</div>

<div id="loader">
  <h1>Open Field</h1>
  <div id="bar"><i></i></div>
  <div class="sub" id="loader-sub">starting…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
